services:
  back:
    build:
      context: .
      target: back
    container_name: microcrm-back
    ports:
      - "8080:8080"
    networks:
      - default
      - elk
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/persons"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  front:
    build:
      context: .
      target: front
    container_name: microcrm-front
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      back:
        condition: service_healthy
    restart: unless-stopped

networks:
  elk:
    name: microcrm-elk-network
    external: true