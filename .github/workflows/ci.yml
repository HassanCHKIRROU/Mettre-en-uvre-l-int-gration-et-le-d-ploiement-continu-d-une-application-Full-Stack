name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend - Build, Test & Sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('back/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: back

      - name: Build and test
        run: ./gradlew build
        working-directory: back

      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar
        working-directory: back

  frontend:
    name: Frontend - Build, Test & Sonar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: front

      - name: Run tests with coverage
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage
        working-directory: front

      - name: Build
        run: npx ng build --configuration production
        working-directory: front

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          projectBaseDir: front
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish-images:
    name: Publier les images Docker sur GHCR
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
  

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push back-end image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: back
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/microcrm-back:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/microcrm-back:${{ github.sha }}

      - name: Build and push front-end image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: front
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/microcrm-front:latest
            ghcr.io/${{ steps.repo.outputs.owner }}/microcrm-front:${{ github.sha }}